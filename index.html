<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Die App spricht mit niemandem: connect-src 'self' verbietet jede Verbindung nach außen.
     Das PDF wird ausschließlich im Browser gelesen. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Angebot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Angebot</title>
</head>
<body>
<header class="leiste">
  <div class="leiste-links" id="links"></div>
  <h1 id="titel">Angebot</h1>
  <div class="leiste-rechts" id="rechts"></div>
</header>
<main id="inhalt"></main>
<input type="file" id="pdf-wahl" accept="application/pdf,.pdf" hidden>
<input type="file" id="bild-wahl" accept="image/*" multiple hidden>
<script type="module" src="app.js"></script>
</body>
</html>
